name: Java CI with Maven - Test and package

on:
  pull_request:
    branches: [ main ]

jobs:
  Build:
    name: Build - Exercice 2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
      
      - name: Build with Maven
        run: mvn -B package